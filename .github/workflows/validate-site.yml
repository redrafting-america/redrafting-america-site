name: Validate static site

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed files for whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

      - name: Check required public files
        run: |
          test -f index.html
          test -f 404.html
          test -f robots.txt
          test -f sitemap.xml

      - name: Check canonical and legacy Worker domains
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const configuredDomains = new Set(
            config.routes
              .filter((route) => route.custom_domain === true)
              .map((route) => route.pattern)
          );
          const requiredDomains = [
            'www.redraftingamerica.org',
            'redraftingamerica.org',
            'www.redraftingamerica.us',
            'redraftingamerica.us',
            'www.redrafting.us',
            'redrafting.us',
            'www.utopiaproject.us',
            'utopiaproject.us',
          ];

          const missingDomains = requiredDomains.filter(
            (domain) => !configuredDomains.has(domain)
          );
          if (missingDomains.length > 0) {
            throw new Error(`Missing Worker custom domains: ${missingDomains.join(', ')}`);
          }
          NODE

      - name: Build publication-ready site
        run: ./scripts/build-cloudflare-site.sh

      - name: Check publication timestamp injection
        run: |
          ! grep -q '__RDA_PUBLICATION_TIMESTAMP__' dist/assets/scripts/site-shell.js
          grep -qE "var PUBLICATION_TIMESTAMP = '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z';" dist/assets/scripts/site-shell.js
          grep -q "Philly Daylight Time" dist/assets/scripts/site-shell.js
          grep -q "Philly Standard Time" dist/assets/scripts/site-shell.js
          grep -q "desktopTablet: 'Updated: ' + fullDate + ' • '" dist/assets/scripts/site-shell.js

      - name: Parse active HTML files
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class SiteParser(HTMLParser):
              pass

          checked = 0
          for path in Path('.').rglob('*.html'):
              if path.parts[0] in {'archive', 'site-work', 'templates'}:
                  continue
              parser = SiteParser()
              parser.feed(path.read_text(encoding='utf-8'))
              parser.close()
              checked += 1

          if checked == 0:
              raise SystemExit('No active HTML files were found.')
          print(f'Parsed {checked} active HTML files.')
          PY

      - name: Reject unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- '*.html' '*.css' '*.js'; then
            echo 'Unresolved merge markers found.' >&2
            exit 1
          fi
