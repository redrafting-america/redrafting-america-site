<!DOCTYPE html>
<html lang="en">
<head>
  <base href="./" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Redrafting America</title>
<meta name="robots" content="noindex" />

<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png" />
<link rel="icon" href="assets/images/redrafting-america-logo-web.png" />
<link rel="alternate" type="application/rss+xml" title="The Drafting Room RSS Feed" href="https://www.redraftingamerica.org/rss.xml" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root {
    --void: #f7f1e3;
    --panel: #efe6d0;
    --panel-2: #efe6d0;
    --panel-line: #ddd0ad;
    --parchment: #17233f;
    --parchment-dim: #5c6478;
    --gold: #b8862c;
    --gold-dim: #96691f;
    --amber: #7a2530;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body {
    margin: 0; padding: 0;
    background: var(--void);
    color: var(--parchment);
    font-family: 'Public Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 2rem; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; column-gap: 1rem;
    padding: 1rem 2rem;
    background: rgba(247,241,227,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--panel-line);
  }
  .brand-group { display: flex; align-items: center; gap: 0.7rem; }
  .brand-logo img { height: 34px; width: 34px; border-radius: 6px; display: block; }
  .breadcrumb {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 0.95rem;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .breadcrumb a { color: var(--parchment); text-decoration: none; }
  .breadcrumb a:hover { color: var(--gold); }
  .status-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.62rem; letter-spacing: 0.1em;
    color: var(--amber); border: 1px solid var(--amber);
    border-radius: 999px; padding: 0.3rem 0.7rem; white-space: nowrap;
  }
  .header-right { display: flex; align-items: center; gap: 1rem; justify-self: end; }

  /* ---------- 404 content ---------- */
  main { flex: 1; padding: 3.5rem 2rem 4rem; }
  .content-in {
    max-width: 560px; margin: 0 auto; text-align: center;
    opacity: 0; transform: translateY(-10px);
    animation: fade-up 0.6s ease forwards;
  }
  @keyframes fade-up { to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) {
    .content-in { animation: none; opacity: 1; transform: none; }
  }

  .book-frame {
    width: min(280px, 70%); margin: 0 auto 1.75rem;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 25px 60px rgba(23,35,63,0.2);
  }
  #tagline {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: clamp(1.3rem, 3.2vw, 1.7rem); line-height: 1.4;
    color: var(--parchment); margin: 0 0 1.5rem;
  }

  .back-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--amber); text-decoration: none;
  }
  .back-link:hover { color: var(--gold-dim); }

  /* search */
  .site-search { margin: 2.25rem auto 0; max-width: 380px; position: relative; }
  .site-search input {
    width: 100%; font-family: 'Public Sans', sans-serif; font-size: 0.92rem;
    color: var(--parchment); background: var(--panel);
    border: 1px solid var(--panel-line); border-radius: 6px;
    padding: 0.7rem 1rem;
  }
  .site-search input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
  .search-results {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 6px;
    overflow: hidden; display: none; text-align: left;
    box-shadow: 0 15px 35px rgba(23,35,63,0.15);
  }
  .search-results.open { display: block; }
  .search-results a {
    display: block; padding: 0.65rem 1rem; text-decoration: none;
    color: var(--parchment); font-size: 0.9rem; border-bottom: 1px solid var(--panel-line);
  }
  .search-results a:last-child { border-bottom: none; }
  .search-results a:hover { background: var(--void); color: var(--amber); }
  .search-empty { padding: 0.65rem 1rem; font-size: 0.85rem; color: var(--parchment-dim); }

  /* helpful links */
  .helpful { margin-top: 2.5rem; }
  .helpful p {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--parchment-dim);
    margin: 0 0 0.9rem;
  }
  .helpful ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  .helpful a { color: var(--amber); text-decoration: none; font-size: 0.95rem; }
  .helpful a:hover { text-decoration: underline; }

  /* ---------- footer ---------- */
  footer {
    padding: 1rem 2rem;
    background: rgba(247,241,227,0.92);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--panel-line);
  }
  .footer-inner {
    min-height: 34px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; flex-wrap: wrap;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem; letter-spacing: 0.04em;
    color: var(--parchment-dim);
  }
  .footer-motto { font-family: 'Fraunces', serif; font-style: italic; color: var(--gold); font-size: 0.85rem; }
</style>
<link rel="stylesheet" href="assets/styles/brand-lockup.css" />
<link rel="stylesheet" href="assets/styles/site-shell.css?v=20260805-3" />
</head>
<body>

  <header>
    <div class="brand-group">
      <a class="brand-logo" href="index.html">
        <img src="assets/images/redrafting-america-logo-web.png" alt="Redrafting America crest" />
      </a>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Redrafting America</a>
      </nav>
    </div>
    <div></div>
    <div class="header-right">
      <div class="status-pill">v0.7 BETA</div>
    </div>
  </header>

  <main>
    <div class="content-in">
      <div class="book-frame">
        <img src="assets/images/constitution-v2-draft-in-progress.png" alt="A glowing Constitution v2.0 book being redrafted by an illuminated pen, marked Draft in Progress" />
      </div>

      <h1 id="tagline">Loading&hellip;</h1>

      <a class="back-link" href="index.html">&larr; Return to Homepage</a>

      <div class="site-search">
        <input type="text" id="search-input" placeholder="Search site&hellip;" autocomplete="off" />
        <div class="search-results" id="search-results"></div>
      </div>

      <div class="helpful">
        <p>Try these instead</p>
        <ul>
          <li><a href="pages/about/mission.html">Our Mission</a></li>
          <li><a href="index.html#constitution">Constitution v2.0</a></li>
          <li><a href="pages/community/drafting-room/index.html">The Drafting Room</a></li>
          <li><a href="pages/newsroom/cultural-influences.html">Cultural Influences</a></li>
          <li><a href="pages/get-involved/careers.html">Careers</a></li>
        </ul>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <span>&copy; 2026 Redrafting America</span>
      <span class="footer-motto">Veritas Super Omnia</span>
      <span>This page does not, in fact, exist</span>
    </div>
  </footer>

  <script>
    var taglines = [
      "Like the Constitution, this page is under reconstruction.",
      "Oops... looks like this page seceded.",
      "We the People... couldn't find this page.",
      "This page took an unexpected recess.",
      "It's not treason. It's just a 404.",
      "This page is filibustering. Try again later.",
      "This page failed the constitutional exam.",
      "This isn't the page you swore to uphold.",
      "Even The Founders couldn't locate this one.",
      "Drafted... then redacted.",
      "404: Article Not Found.",
      "This page lost its quorum.",
      "This content has been impeached.",
      "Page denied due to lack of due process.",
      "This address was vetoed by the system.",
      "The Concordium adjourned before finishing this page.",
      "This page was vetoed by Constitution v2.0.",
      "Clause not found. Please consult the Immutable Laws.",
      "You\u2019ve reached a constitutional crisis. (Literally.)",
      "The Concordium debated this page... and tabled it indefinitely.",
      "404: Resolution failed in The Concordium.",
      "This page was filibustered by a rogue delegate.",
      "Portal error: Page not authorized for your citizen tier.",
      "This page has been flagged for revision in the Citizen Portal.",
      "Portal malfunction \u2014 please log in using your UNID and try again.",
      "Your UNID doesn\u2019t grant access to this page.",
      "Access denied. Page not linked to your constitutional permissions.",
      "Even the Companion Guide doesn\u2019t know what this page is.",
      "Page not annotated. Try a different section.",
      "This page is under investigation by the Oversight Branch.",
      "This section failed its civic examination.",
      "This page self-deleted to preserve civic balance.",
      "The algorithm has declared this page obsolete.",
      "This request was denied by the Ethical Firewall."
    ];

    document.getElementById('tagline').textContent =
      taglines[Math.floor(Math.random() * taglines.length)];

    // Minimal working site search — real pages only, filters as you type
    var pages = [
      { title: "Home", url: "/" },
      { title: "Our Mission", url: "mission.html" },
      { title: "Constitution v2.0", url: "/#constitution" },
      { title: "The Drafting Room", url: "the-drafting-room.html" },
      { title: "Founder’s Introduction — Paper", url: "drafting-room/papers/founders-introduction.html" },
      { title: "America at 250 — Paper", url: "drafting-room/papers/america-at-250.html" },
      { title: "Godwin’s Law — Paper", url: "drafting-room/papers/godwins-law.html" },
      { title: "A Call to the People — Paper", url: "drafting-room/papers/a-call-to-the-people.html" },
      { title: "Bots on the Street — Drafting Note", url: "drafting-room/drafting-notes/bots-on-the-street.html" },
      { title: "Cultural Influences", url: "cultural-influences.html" },
      { title: "Careers & Leadership", url: "careers.html" },
      { title: "Contact", url: "/#contact" }
    ];

    var input = document.getElementById('search-input');
    var results = document.getElementById('search-results');

    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      if (!q) { results.classList.remove('open'); results.innerHTML = ''; return; }
      var matches = pages.filter(function (p) { return p.title.toLowerCase().includes(q); });
      results.innerHTML = matches.length
        ? matches.map(function (p) { return '<a href="' + p.url + '">' + p.title + '</a>'; }).join('')
        : '<div class="search-empty">No pages match &mdash; try Mission or Careers.</div>';
      results.classList.add('open');
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('.site-search')) results.classList.remove('open');
    });
  </script>

  <script src="assets/scripts/site-shell.js"></script>
</body>
</html>
